<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Telegram Brand Gradient -->
    <linearGradient id="tg-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37BBFE"/>
      <stop offset="100%" stop-color="#007DBB"/>
    </linearGradient>

    <!-- Glowing Pulse Gradient -->
    <linearGradient id="pulse-grad-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#37BBFE"/>
    </linearGradient>

    <linearGradient id="pulse-grad-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37BBFE"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="boost" operator="over" />
    </filter>

    <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="boost" operator="over" />
    </filter>
  </defs>

  <!-- 1. Pulse Waveform Stream (Transparent Background) -->
  <g filter="url(#neon-glow)">
    <!-- Left Input Pulse Line -->
    <path d="M 32 256 
             H 80 
             L 95 210 
             L 110 300 
             L 125 150 
             L 142 340 
             L 155 256 
             H 170" 
          fill="none" 
          stroke="url(#pulse-grad-left)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Output Pulse Line -->
    <path d="M 342 256 
             H 355 
             L 368 190 
             L 385 330 
             L 402 170 
             L 418 290 
             L 430 256 
             H 480" 
          fill="none" 
          stroke="url(#pulse-grad-right)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- 2. Official Telegram Emblem Badge -->
  <g transform="translate(256, 256)" filter="url(#badge-glow)">
    <!-- Outer Cyan Halo Ring -->
    <circle cx="0" cy="0" r="98" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.5" stroke-dasharray="6 6"/>

    <!-- Telegram Circle Base -->
    <g transform="scale(6.2) translate(-16, -16)">
      <circle cx="16" cy="16" r="14" fill="url(#tg-blue)" stroke="#ffffff" stroke-width="0.5"/>
      <path d="M22.9866 10.2088C23.1112 9.40332 22.3454 8.76755 21.6292 9.082L7.36482 15.3448C6.85123 15.5703 6.8888 16.3483 7.42147 16.5179L10.3631 17.4547C10.9246 17.6335 11.5325 17.541 12.0228 17.2023L18.655 12.6203C18.855 12.4821 19.073 12.7665 18.9021 12.9426L14.1281 17.8646C13.665 18.3421 13.7569 19.1512 14.314 19.5005L19.659 22.8523C20.2585 23.2282 21.0297 22.8506 21.1418 22.1261L22.9866 10.2088Z" fill="#FFFFFF"/>
    </g>

    <!-- Seamless Docking Connection Nodes -->
    <circle cx="-86" cy="0" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="86" cy="0" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
