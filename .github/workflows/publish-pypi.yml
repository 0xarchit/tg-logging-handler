name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist + wheel
        run: uv build

      - name: Check metadata (twine)
        run: uv run --with twine twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install from PyPI
        run: |
          uv venv --python ${{ matrix.python-version }}
          for i in 1 2 3 4 5; do
            uv pip install tg-logging-handler && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

      - name: Smoke test
        run: >-
          .venv/bin/python -c "
          import tg_logging_handler as m;
          assert hasattr(m, 'TelegramLoggingHandler');
          assert hasattr(m, 'TGLoggingHandler');
          assert hasattr(m, 'TelegramConfigError');
          assert hasattr(m, '__version__');
          print('OK:', m.__version__)
          "
