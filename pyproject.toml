[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-logging-handler"
version = "0.1.4"
description = "Production-grade Telegram destination for Python's standard logging module"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Archit", email = "0xarchit@gmail.com" }]
keywords = ["logging", "telegram", "telegram-bot", "handler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/0xarchit/tg-logging-handler"
Repository = "https://github.com/0xarchit/tg-logging-handler"
Issues = "https://github.com/0xarchit/tg-logging-handler/issues"
Changelog = "https://github.com/0xarchit/tg-logging-handler/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=9.0.3",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["tg_logging_handler"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents", ".claude", "docs", "plan.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tg_logging_handler"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["tg_logging_handler", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tg_logging_handler"]

[tool.coverage.report]
fail_under = 90
